name: Visual Screenshots

on:
  pull_request:
    branches: [main]

# PR code, dependencies, and browser tests run without publishing credentials.
permissions:
  contents: read

concurrency:
  group: visual-screenshots-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build PR head
        run: npm run build

      - name: Take screenshots of PR head
        run: npx playwright test e2e/visual.spec.ts
        env:
          SCREENSHOT_OUTPUT_DIR: ${{ runner.temp }}/visual-screenshots/pr

      - name: Checkout base commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: main-branch
          persist-credentials: false

      - name: Install dependencies (main)
        working-directory: main-branch
        run: npm ci

      - name: Build main
        working-directory: main-branch
        run: npm run build

      - name: Take screenshots of main with the same tests
        run: |
          cp e2e/visual.spec.ts main-branch/e2e/visual.spec.ts
          cp playwright.config.ts main-branch/playwright.config.ts
          cd main-branch
          npx playwright test e2e/visual.spec.ts
        env:
          SCREENSHOT_OUTPUT_DIR: ${{ runner.temp }}/visual-screenshots/main

      - name: Record captured revisions
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          metadata = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "pr": int(os.environ["PR_NUMBER"]),
              "head_sha": os.environ["HEAD_SHA"],
              "base_sha": os.environ["BASE_SHA"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
          }
          path = Path(os.environ["RUNNER_TEMP"]) / "visual-screenshots/metadata.json"
          path.write_text(json.dumps(metadata))
          PY
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

      - name: Upload screenshots for the trusted publisher
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-screenshots-${{ github.run_attempt }}
          path: ${{ runner.temp }}/visual-screenshots/
          if-no-files-found: error
          retention-days: 7
